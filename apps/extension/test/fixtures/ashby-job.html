<!doctype html>
<!-- Shape of a jobs.ashbyhq.com posting: JSON-LD with hiringOrganization and identifier, page title "Role @ Company". The app renders into #root. -->
<html>
  <head>
    <title>Product Designer @ Tailspin</title>
    <meta property="og:title" content=" Product Designer" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org/",
        "@type": "JobPosting",
        "title": " Product Designer",
        "identifier": {
          "@type": "PropertyValue",
          "name": "Tailspin",
          "value": "0b6f2a52-6d6e-4a8b-9f43-6a0e3c2d1b7a"
        },
        "hiringOrganization": {
          "@type": "Organization",
          "name": "Tailspin",
          "sameAs": "https://tailspin.example"
        },
        "jobLocation": {
          "@type": "Place",
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "New York City",
            "addressRegion": "NY",
            "addressCountry": "USA"
          }
        }
      }
    </script>
  </head>
  <body>
    <div id="root">
      <h1>Product Designer</h1>
      <p>We're excited to hear from you. Thank you for applying!</p>
    </div>
    <script>
      window.__appData = {
        applicationSubmittedSuccessMessage:
          "Your application was successfully submitted.",
      };
    </script>
  </body>
</html>
