<!doctype html>
<!-- Shape of a jobs.lever.co posting: JSON-LD JobPosting, .posting-headline, page title "Company - Role". -->
<html>
  <head>
    <title>Fabrikam - Backend Engineer, Payments</title>
    <meta property="og:title" content="Fabrikam - Backend Engineer, Payments" />
    <script type="application/ld+json">
      {
        "@context": "http://schema.org",
        "@type": "JobPosting",
        "title": "Backend Engineer, Payments",
        "hiringOrganization": { "@type": "Organization", "name": "Fabrikam" },
        "jobLocation": [
          {
            "@type": "Place",
            "address": {
              "@type": "PostalAddress",
              "addressLocality": "Toronto",
              "addressRegion": null
            }
          },
          {
            "@type": "Place",
            "address": {
              "@type": "PostalAddress",
              "addressLocality": "Montreal"
            }
          }
        ],
        "employmentType": "Full-time"
      }
    </script>
  </head>
  <body>
    <div class="posting-headline">
      <h2>Backend Engineer, Payments</h2>
      <div class="posting-categories">
        <div class="sort-by-time posting-category location">Toronto</div>
      </div>
    </div>
  </body>
</html>
