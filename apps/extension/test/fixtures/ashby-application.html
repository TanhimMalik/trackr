<!doctype html>
<!-- The application tab (2026): no <form> element; fields live in .ashby-application-form-container. -->
<html>
  <head>
    <title>Product Designer @ Tailspin</title>
  </head>
  <body>
    <div id="root">
      <div class="ashby-job-posting-right-pane-application-tab">
        <div class="ashby-application-form-container">
          <div class="ashby-application-form-field-entry">
            <label for="_systemfield_email">Email</label>
            <input
              id="_systemfield_email"
              name="_systemfield_email"
              type="email"
            />
          </div>
          <button>Submit Application</button>
        </div>
      </div>
    </div>
  </body>
</html>
