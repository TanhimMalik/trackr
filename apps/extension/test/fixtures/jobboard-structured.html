<!doctype html>
<!-- Shape of a job board's posting page (Indeed, LinkedIn's public view): a JSON-LD JobPosting with the description. -->
<html>
  <head>
    <title>Junior Software Engineer - Remote - Example Jobs</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "JobPosting",
        "title": "Junior Software Engineer",
        "hiringOrganization": {
          "@type": "Organization",
          "name": "Tailspin Health"
        },
        "jobLocationType": "TELECOMMUTE",
        "description": "<p>Build our patient portal in TypeScript.</p><ul><li>1+ years of experience</li></ul>"
      }
    </script>
  </head>
  <body>
    <h1>Junior Software Engineer</h1>
  </body>
</html>
